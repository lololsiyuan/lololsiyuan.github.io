# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: lololsiyuan
subtitle: 'Just do it'
description: '前端开发者的技术博客，记录代码与生活。'
keywords: 前端, JavaScript, Vue, uni-app, 小程序
author: lololsiyuan
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://lololsiyuan.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter:
highlight:
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: false
  line_number: false
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 未分类
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: particlex

# Deployment
deploy:
  type: git
  repo: https://github.com/lololsiyuan/lololsiyuan.github.io.git
  branch: gh-pages
  message: 'Site updated: {{ now("YYYY-MM-DD HH:mm:ss") }}'

# ParticleX needs flat archives
archive_generator:
  enabled: true
  per_page: 0
  yearly: false
  monthly: false
  daily: false

category_generator:
  per_page: 10
tag_generator:
  per_page: 10

# GitHub 热点页：构建时读取本地 deepseek-trending 的最新榜单
trending:
  enable: true
  repo_path: H:/deepseekbot/deepseek-trending
